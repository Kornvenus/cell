<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Animal Cell Model</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    model-viewer {
      width: 100%;
      height: 600px;
      background-color: #f4f4f9;
      border-radius: 12px;
    }

    /* ตกแต่งปุ่มจุดปักหมุด */
    .Hotspot {
      background: #ff4757;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
      height: 20px;
      padding: 0;
      width: 20px;
      position: relative;
      transition: transform 0.2s;
    }

    .Hotspot:hover {
      transform: scale(1.3);
      background-color: #2ed573;
    }

    /* กล่องข้อความบอกชื่อออร์แกเนลล์ */
    .HotspotAnnotation {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      color: #fff;
      display: block;
      font-family: sans-serif;
      font-size: 13px;
      left: calc(100% + 10px);
      padding: 6px 10px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <model-viewer src="animal_cell.glb" camera-controls auto-rotate shadow-intensity="1" alt="โมเดลเซลล์สัตว์ 3D">
    
    <button class="Hotspot" slot="hotspot-1" data-position="0m 0m 0m" data-normal="0m 1m 0m">
      <div class="HotspotAnnotation">นิวเคลียส (Nucleus)</div>
    </button>

    <button class="Hotspot" slot="hotspot-2" data-position="0.2m 0.1m -0.1m" data-normal="1m 0m 0m">
      <div class="HotspotAnnotation">ไมโทคอนเดรีย (Mitochondria)</div>
    </button>

  </model-viewer>

</body>
</html>
